<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bin Check — Component Inventory</title>
<style>
  :root {
    --bg: #0d1210;
    --bg-panel: #131a17;
    --bg-row: #101613;
    --bg-row-alt: #121a16;
    --line: #22302a;
    --line-soft: #1a2521;
    --copper: #c97a4a;
    --copper-bright: #e8934f;
    --silk: #d9e2dc;
    --silk-dim: #8ba69a;
    --silk-faint: #5c7168;
    --green-led: #6fcf97;
    --amber: #e0b355;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "IBM Plex Sans", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--silk);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 22px 16px 60px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  header {
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--silk);
  }
  h1 span { color: var(--copper-bright); }
  .stat {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--silk-dim);
  }
  .stat b { color: var(--amber); font-weight: 600; }

  .search-box {
    margin-top: 16px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--silk);
    font-family: var(--mono);
    font-size: 0.95rem;
    padding: 13px 14px 13px 38px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .search-box input:focus { border-color: var(--copper); }
  .search-box input::placeholder { color: var(--silk-faint); }
  .search-box::before {
    content: "⌕";
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--silk-faint);
    font-size: 1.1rem;
    pointer-events: none;
  }

  .filter-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .chip {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--silk-dim);
    background: var(--bg-panel);
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    user-select: none;
    transition: all 0.12s ease;
  }
  .chip:hover { border-color: var(--silk-faint); color: var(--silk); }
  .chip.active {
    background: rgba(201,122,74,0.14);
    border-color: var(--copper);
    color: var(--copper-bright);
  }

  #results { margin-top: 18px; }
  .count-line {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--silk-faint);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .part-card {
    background: var(--bg-row);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 2px;
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: border-left-color 0.15s ease;
  }
  .part-card:hover { border-left-color: var(--copper); }

  .part-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .part-desc {
    font-size: 0.92rem;
    color: var(--silk);
    line-height: 1.35;
    flex: 1;
  }
  .qty-pill {
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--green-led);
    background: rgba(111,207,151,0.08);
    border: 1px solid rgba(111,207,151,0.25);
    padding: 3px 9px;
    border-radius: 3px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .qty-pill .unit { color: var(--silk-faint); font-weight: 400; font-size: 0.72rem; }

  .part-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--silk-dim);
  }
  .part-meta .m-label { color: var(--silk-faint); }
  .footprint-tag {
    font-family: var(--mono);
    font-size: 0.72rem;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--amber);
    padding: 1px 7px;
    border-radius: 3px;
  }

  .part-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--line-soft);
    flex-wrap: wrap;
    gap: 8px;
  }
  .orders-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .order-tag {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--silk-faint);
    background: var(--bg-panel);
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid var(--line-soft);
  }
  .lcsc-link {
    font-family: var(--mono);
    font-size: 0.76rem;
    color: var(--copper-bright);
    text-decoration: none;
    border-bottom: 1px solid rgba(201,122,74,0.35);
    padding-bottom: 1px;
    white-space: nowrap;
  }
  .lcsc-link:hover { color: var(--amber); border-color: var(--amber); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--silk-faint);
    font-family: var(--mono);
    font-size: 0.85rem;
  }

  ::selection { background: rgba(201,122,74,0.3); }

  @media (max-width: 480px) {
    h1 { font-size: 1.25rem; }
    .part-desc { font-size: 0.88rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow-row">
      <h1>bin<span>check</span></h1>
      <div class="stat"><b id="totalParts">0</b> parts on hand · <b id="totalOrders">10</b> orders</div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="search description, LCSC #, MPN, package, manufacturer…" autocomplete="off">
    </div>
    <div class="filter-row" id="filterRow"></div>
  </header>

  <div id="results">
    <div class="count-line" id="countLine"></div>
    <div id="cardContainer"></div>
  </div>
</div>

const totalPartsEl = document.getElementById('totalParts');
const totalOrdersEl = document.getElementById('totalOrders');
const cardContainer = document.getElementById('cardContainer');
const countLine = document.getElementById('countLine');
const searchInput = document.getElementById('searchInput');
const filterRow = document.getElementById('filterRow');

totalPartsEl.textContent = PARTS.length;
const orderSet = new Set();
PARTS.forEach(p => p.orders.forEach(o => orderSet.add(o.order_id)));
totalOrdersEl.textContent = orderSet.size;

// Build package-type quick filters from common categories
function categorize(p) {
  const d = (p.description + ' ' + p.mpn).toLowerCase();
  if (/resistor/.test(d)) return 'Resistors';
  if (/capacitor/.test(d)) return 'Capacitors';
  if (/led/.test(d)) return 'LEDs';
  if (/connector|receptacle|header/.test(d)) return 'Connectors';
  if (/switch|button/.test(d)) return 'Switches';
  if (/regulator|ldo/.test(d)) return 'Regulators';
  if (/microcontroller|mcu|esp32|esp8285|stm32|atmega|ch552/.test(d)) return 'MCUs/ICs';
  if (/crystal|oscillator|resonator/.test(d)) return 'Timing';
  return 'Other';
}
PARTS.forEach(p => p._cat = categorize(p));
const cats = ['All', ...Array.from(new Set(PARTS.map(p => p._cat))).sort()];
let activeCat = 'All';

function renderChips() {
  filterRow.innerHTML = '';
  cats.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (c === activeCat ? ' active' : '');
    chip.textContent = c;
    chip.onclick = () => { activeCat = c; renderChips(); render(); };
    filterRow.appendChild(chip);
  });
}

function lcscUrl(id) {
  return 'https://www.lcsc.com/search?q=' + encodeURIComponent(id);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  let filtered = PARTS.filter(p => {
    if (activeCat !== 'All' && p._cat !== activeCat) return false;
    if (!q) return true;
    const hay = [p.lcsc, p.mpn, p.manufacturer, p.package, p.description].join(' ').toLowerCase();
    return hay.includes(q);
  });

  countLine.textContent = filtered.length + (filtered.length === 1 ? ' part' : ' parts');

  if (filtered.length === 0) {
    cardContainer.innerHTML = '<div class="empty-state">nothing on the shelf matches that.</div>';
    return;
  }

  cardContainer.innerHTML = filtered.map(p => {
    const ordersHtml = p.orders.map(o =>
      '<span class="order-tag">' + escapeHtml(o.order_id) + ' · qty ' + escapeHtml(o.qty) + '</span>'
    ).join('');
    return '<div class="part-card">' +
      '<div class="part-top">' +
        '<div class="part-desc">' + escapeHtml(p.description) + '</div>' +
        '<div class="qty-pill">' + p.total_qty + ' <span class="unit">on hand</span></div>' +
      '</div>' +
      '<div class="part-meta">' +
        '<span><span class="m-label">LCSC</span> ' + escapeHtml(p.lcsc) + '</span>' +
        '<span><span class="m-label">MPN</span> ' + escapeHtml(p.mpn) + '</span>' +
        '<span><span class="m-label">mfr</span> ' + escapeHtml(p.manufacturer) + '</span>' +
        '<span class="footprint-tag">' + escapeHtml(p.package) + '</span>' +
      '</div>' +
      '<div class="part-bottom">' +
        '<div class="orders-list">' + ordersHtml + '</div>' +
        '<a class="lcsc-link" href="' + lcscUrl(p.lcsc) + '" target="_blank" rel="noopener">view on LCSC →</a>' +
      '</div>' +
    '</div>';
  }).join('');
}

searchInput.addEventListener('input', render);
renderChips();
render();
</script>
